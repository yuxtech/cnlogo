---
"on":
  push:
  pull_request:
  workflow_dispatch:

# https://github.com/softprops/action-gh-release/issues/236
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get -y update
          sudo apt-get -y install libreadline-dev
      - uses: actions/checkout@v7
      - uses: lumen-oss/luarocks-tag-release@v9
        env:
          LUX_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
          HISTORY_LIBDIR: /usr/lib/x86_64-linux-gnu
        with:
          lua_version: "5.3"
          lux_version: latest
          dependencies: |
            pgf
          license: AGPL-3.0-or-later
      - name: Pack
        env:
          HISTORY_LIBDIR: /usr/lib/x86_64-linux-gnu
        run: |
          lx --lua-version=5.3 pack
      - uses: actions/upload-artifact@v7
        if: "! startsWith(github.ref, 'refs/tags/')"
        with:
          path: |
            *.rock
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            *.rock
      - name: Upload
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          scripts/upload.sh ./*.rock
        env:
          LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: xu-cheng/texlive-action@v3
        if: " ! startsWith(github.ref, 'refs/tags/') "
        with:
          run: |
            l3build ctan
      - uses: xu-cheng/texlive-action@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          run: |
            apk add git
            git config --global --add safe.directory '*'
            l3build tag ${{ github.ref_name }}
            l3build ctan
      - uses: actions/upload-artifact@v7
        if: " ! startsWith(github.ref, 'refs/tags/') "
        with:
          path: |
            build/distrib/*/*.zip
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/distrib/*/*.zip
