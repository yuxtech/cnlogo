---
"on":
  push:
  pull_request:
  workflow_dispatch:

# https://github.com/softprops/action-gh-release/issues/236
permissions:
  contents: write

env:
  files: build/distrib/*/*.zip

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get -y update
          sudo apt-get -y install libreadline-dev
      - uses: lumen-oss/luarocks-tag-release@v9
        env:
          LUX_API_KEY: ${{secrets.LUAROCKS_API_KEY}}
          HISTORY_INCDIR: /usr/include
          HISTORY_LIBDIR: /usr/lib/x86_64-linux-gnu
          READLINE_INCDIR: /usr/include
          READLINE_LIBDIR: /usr/lib/x86_64-linux-gnu
        with:
          lua_version: "5.3"
          lux_version: 0.49.0
          dependencies: |
            pgf
          template: assets/lua/template.lua
          license: AGPL-3.0-or-later

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/texlive-action/full@v1
        if: ${{ ! startsWith(github.ref, 'refs/tags/') }}
        with:
          run: |
            l3build ctan
      - uses: actions/upload-artifact@v4
        if: ${{ ! startsWith(github.ref, 'refs/tags/') }}
        with:
          path: |
            ${{ env.files }}
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ env.files }}
      - uses: xu-cheng/texlive-action/full@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          run: |
            apk add git
            git config --global --add safe.directory '*'
            l3build tag ${{ github.ref_name }}
            l3build ctan
